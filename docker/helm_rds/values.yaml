nameOverride: ""
fullnameOverride: ""
namespace: ua-vpit--research-technologies--rds

omekas:
  replicas: 1
  strategy:
    type: Recreate
  image:
    repository: registry.docker.iu.edu/rds/omekas-test
    tag: latest
    pullPolicy: Always
  rolloutToken: ""
  imagePullSecrets: []
  modules: |
    Common: https://github.com/Daniel-KM/Omeka-S-module-Common/releases/download/3.4.85/Common-3.4.85.zip
    PageBlocks: https://github.com/arepr/omeka-s-module-pageblocks/releases/download/1.3/PageBlocks.zip
    CSVImport: https://github.com/omeka-s-modules/CSVImport/releases/download/v2.6.2/CSVImport-2.6.2.zip
    HideProperties: https://github.com/zerocrates/HideProperties/releases/download/v1.3.1/HideProperties-1.3.1.zip
    Log: https://github.com/Daniel-KM/Omeka-S-module-Log/releases/download/3.4.38/Log-3.4.38.zip
    CustomOntology: https://github.com/Daniel-KM/Omeka-S-module-CustomOntology/releases/download/3.4.6/CustomOntology-3.4.6.zip
    Sitemaps: https://github.com/ManOnDaMoon/omeka-s-module-Sitemaps/releases/download/v1.1/Sitemaps-1.1.zip
    Shortcode: https://github.com/Daniel-KM/Omeka-S-module-Shortcode/releases/download/3.4.15/Shortcode-3.4.15.zip
    OIDC: https://github.com/webgisdeveloper/omeka-s-module-oidc
  installModulesOnStartup: true
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: "0"
      memory: "0"
    limits:
      cpu: "1"
      memory: 1Gi
  readinessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  startupProbe:
    tcpSocket:
      port: 80
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 180
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []

ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: omekas-test.apps.iu.edu
  path: /
  pathType: Prefix
  tls: []

pvc:
  storageRequest: 2Gi
  storageClassName: bl-sp-tkg-k8s-v2

# Non-sensitive configuration — safe to commit
config:
  mysqlDatabase: sdsrdc_sdscore_test
  mysqlUser: sdsrdc_sdscore_adminuser
  mysqlHost: sasrdsmp02.uits.iu.edu
  applicationEnv: development
  omekaAdminEmail: "wang208@iu.edu"
  omekaAdminName: "Jun Wang"
  omekaSiteTitle: SDS Test Site
  omekaTimezone: America/New_York
  oidcDomain: "https://rdslogin.us.auth0.com"
  oidcClientId: "B4zbiUwAxVsWgBroKiRoCYJQs7O28QH9"

# Sensitive credentials — override with --set or a secrets file; do NOT commit real values
secrets:
  # Set to false when the secret is managed externally (e.g. via kubectl) to skip Helm creating it
  create: true
  mysqlPassword: ""
  omekaAdminPassword: ""
  oidcClientSecret: ""
